<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Campus Route - Student Support</title>
  <link rel="icon" href="/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app"><main class="loading" aria-live="polite">Opening Campus Route...</main></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>
  <dialog id="request-dialog" aria-labelledby="dialog-title"></dialog>


  <!-- US 10: AI Model Management & Retraining Pipeline UI -->
  <div id="ai-model-management" class="card p-4 mt-4">
      <h3>🤖 AI Model Management & Retraining Pipeline (US 10)</h3>
      <p class="text-muted">Collects staff corrections, validates retrained models against held-out data, and provides 1-click rollback capability.</p>

      <div class="d-flex gap-2 mb-3">
          <button id="btn-run-retrain" class="btn btn-primary" onclick="triggerRetrain()">🚀 Run Retraining Workflow</button>
          <button class="btn btn-outline-secondary" onclick="loadModelVersions()">🔄 Refresh Versions</button>
      </div>

      <div id="retrain-status-alert"></div>

      <table class="table table-bordered mt-3">
          <thead>
          <tr>
              <th>Version ID</th>
              <th>Accuracy</th>
              <th>Status</th>
              <th>Trained Date</th>
              <th>Action</th>
          </tr>
          </thead>
          <tbody id="model-versions-tbody">
          <!-- Dynamic model versions will be loaded here -->
          </tbody>
      </table>
  </div>
</body>
</html>
