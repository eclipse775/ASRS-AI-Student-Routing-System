name: Tests

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Backend tests
        run: python -m unittest discover -s tests -v
      - name: Package audit
        run: python scripts/audit_package.py
